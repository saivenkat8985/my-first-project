<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Srikanth Onion Store | Aduri Onion Mart | Guntur</title>

  <meta name="description" content="Srikanth Onion Store (Aduri Onion Mart) – Fresh red onions delivered in Guntur Balaji Nagar. Order onions via WhatsApp. Owner: Aduri Srikanth.">

  <meta name="keywords" content="Srikanth Onion Store, Aduri Onion Mart, Onion Shop Guntur, Fresh Onions Guntur, Balaji Nagar Onion Delivery">

  <meta name="author" content="Aduri Srikanth">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="container">
  <h2>🔐 Login / Signup</h2>
  <input type="text" id="name" placeholder="Enter Name">
  <input type="email" id="email" placeholder="Enter Email">
  <input type="password" id="password" placeholder="Set Password">
  <button onclick="login()">Continue</button>
</div>

<!-- MAIN APP -->
<div id="appScreen" class="hidden">

  <header>
    <h1>🧅 Aduri Onion Mart</h1>
    <p>Owner: Aduri Srikanth</p>
  </header>

  <div class="container">
    <div class="product">
      <img src="https://source.unsplash.com/400x250/?onion" alt="Onion">
      <h3>Fresh Red Onions</h3>
      <p>₹30 per Kg</p>

      <input type="number" id="qty" placeholder="Quantity (Kg)">

      <select id="line">
        <option value="">Select Your Line</option>
        <option>1st Line</option>
        <option>2nd Line</option>
        <option>3rd Line</option>
        <option>4th Line</option>
        <option>5th Line</option>
        <option>6th Line</option>
        <option>7th Line</option>
        <option>8th Line</option>
        <option>9th Line</option>
        <option>10th Line</option>
        <option>11th Line</option>
      </select>

      <button onclick="orderOnion()">Order Now</button>

      <button class="install-btn" onclick="installApp()">📲 Install App</button>

      <p class="note">
        Delivery only: Guntur – Balaji Nagar – Mani Hotel Center (Lines 1–11)
      </p>
    </div>

    <h3>📦 Customer Orders (Owner Only)</h3>
    <ul id="customerList"></ul>
  </div>

  <footer>
    📞 WhatsApp Orders: 6302609140
  </footer>

</div>

<script src="script.js"></script>
</body>
</html>
